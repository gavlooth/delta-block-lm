[package]
name = "dre-attention"
description = "Windowed bidirectional local attention"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
cuda = ["burn/cuda", "dre-core/cuda"]
# Opt-in ndarray execution for dependent CPU tests, never enabled by production dependencies.
cpu-oracle = ["burn/ndarray"]

[dependencies]
burn.workspace = true
dre-core.workspace = true
cubecl = { version = "=0.11.0", features = ["stdlib"] }

[dev-dependencies]
burn = { workspace = true, features = ["ndarray"] }
burn-std = "=0.22.0"
