[package]
name = "delta-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
vulkan = ["burn/vulkan", "dep:burn-cubecl", "dep:cubecl", "burn-cubecl/vulkan"]
cuda = ["burn/cuda", "dep:burn-cubecl", "dep:cubecl", "burn-cubecl/cuda"]
fusion = ["burn/fusion", "burn-cubecl?/fusion"]

[dependencies]
burn = { workspace = true, features = ["extension"] }
burn-cubecl = { version = "=0.22.1", optional = true, default-features = false, features = ["std"] }
cubecl = { version = "=0.11.3", optional = true, default-features = false, features = ["std"] }
