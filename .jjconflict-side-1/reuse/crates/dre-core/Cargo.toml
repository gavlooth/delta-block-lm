[package]
name = "dre-core"
description = "Shared sequence layout and device helpers for the relation extractor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
cuda = ["burn/cuda"]

[dependencies]
burn.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
burn = { workspace = true, features = ["ndarray"] }
