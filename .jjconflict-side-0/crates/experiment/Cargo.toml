[package]
name = "delta-experiment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["cpu"]
cpu = ["burn/ndarray", "delta-mixers/cpu"]
vulkan = ["burn/vulkan", "burn/cubecl", "dep:cubecl", "cubecl/vulkan", "delta-mixers/vulkan"]
cuda = ["burn/cuda", "burn/cubecl", "dep:cubecl", "cubecl/cuda", "delta-mixers/cuda"]
fusion = ["burn/fusion", "delta-mixers/fusion"]
autotune = ["burn/autotune"]

[dependencies]
burn.workspace = true
burn-pack.workspace = true
delta-mixers.workspace = true
delta-kernels.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
sha2.workspace = true
cubecl = { version = "=0.11.0", default-features = false, features = ["std", "persistence"], optional = true }
