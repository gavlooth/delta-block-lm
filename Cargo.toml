[patch.crates-io]
cubecl-wgpu = { path = "vendor/cubecl-wgpu" }

[workspace]
members = ["crates/kernels", "crates/mixers", "crates/experiment"]
exclude = ["reuse"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
burn = { version = "=0.22.1", default-features = false, features = ["std", "optim"] }
burn-pack = { version = "=0.22.1", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
sha2 = "0.10"
delta-mixers = { path = "crates/mixers", default-features = false }
delta-kernels = { path = "crates/kernels", default-features = false }

[profile.dev]
debug = false

[profile.test]
debug = false

# Cargo's wildcard excludes workspace members. Keep local policy explicit as well.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test.package."*"]
opt-level = 2
debug = false

[profile.dev.package.delta-kernels]
opt-level = 0

[profile.dev.package.delta-mixers]
opt-level = 0

[profile.dev.package.delta-experiment]
opt-level = 0
