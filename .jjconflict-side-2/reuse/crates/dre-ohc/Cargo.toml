[package]
name = "dre-ohc"
description = "Orthogonal hyper-connections: 4-stream SO(4) residual read/write wrapper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
cuda = ["burn/cuda", "dre-core/cuda"]

[dependencies]
burn.workspace = true
dre-core.workspace = true

[dev-dependencies]
burn = { workspace = true, features = ["ndarray"] }
